<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="bar-container">
            <img src="./images/food logo.jpg" alt="logo">
            <div class="menu-container">
                <a href="#">Products </a> 
                <a href="#">Events</a>
                <a href="#">New Arrivals</a>
                <a href="#">Promotions</a>
                <a href="#">About Us</a>
                <a href="#">Contact</a>
            </div>
            <input type="text" placeholder="Search..."  >
        </div>  
    </header>
    <main>
        <div class="main-container">
            <div class="front-image"><img src="./images/imgB.jpg" alt="imageBig" ></div>
            <h1>Featured Categories</h1>

            <div class="categories-container">
                <div>
                <img src="./images/food1.jpg" alt="food1">
                <h2>Snacks</h2>
                </div>
                <div>
                    <img src="./images/food2.jpg" alt="food2">
                    <h2>Seafood</h2>
                </div>
                <div>
                    <img src="./images/food3.jpg" alt="food3">
                    <h2>Produce</h2>
                </div>
                <div>
                    <img src="./images/food4.jpg" alt="food4">
                    <h2>Meat</h2>
                </div>
                <div>
                    <img src="./images/food5.jpg" alt="food5">
                    <h2>Grocery</h2>
                </div>
                <div>
                    <img src="./images/food6.jpg" alt="food6">
                    <h2>Diary</h2>
                </div>
                <div>
                    <img src="./images/food7.jpg" alt="food7">
                    <h2>Beverage</h2>
                </div>
                <div>
                    <img src="./images/food8.jpg" alt="food8">
                    <h2>Bakery</h2>
                </div>
            </div>
            

        </div>
    </main>
 
</body>
</html>
